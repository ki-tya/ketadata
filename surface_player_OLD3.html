
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KETADATA / SURFACE PLAYER</title>
<style>
:root {
  color-scheme:dark;
  --bar:42px;
  --line:#292929;
}
* { box-sizing:border-box; }
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
button,input { font:inherit; }
button {
  border:0;
  background:none;
  color:#777;
  cursor:pointer;
}
button:hover,button.active { color:#fff; }
button:focus-visible,
input:focus-visible,
a:focus-visible {
  outline:1px solid #aaa;
  outline-offset:2px;
}

/* FULLSCREEN SURFACE */

#surface {
  position:fixed;
  inset:0 0 var(--bar);
  background:#000;
}
#frame,#video,#audio {
  width:100%;
  height:100%;
  border:0;
  display:none;
  background:#000;
}
#frame.on,#video.on,#audio.on { display:block; }
#empty {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#555;
  font-size:11px;
  letter-spacing:.17em;
  pointer-events:none;
}
#empty.hide { display:none; }

/* BOTTOM BAR */

#bar {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:var(--bar);
  border-top:1px solid var(--line);
  background:#000;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  padding:0 17px;
  z-index:30;
  font-size:11px;
  letter-spacing:.08em;
}
#bar-left,#bar-center,#bar-right {
  display:flex;
  align-items:center;
  min-width:0;
}
#bar-left {
  gap:17px;
  justify-self:start;
  max-width:100%;
}
#bar-center {
  gap:17px;
  justify-self:center;
}
#bar-right {
  gap:14px;
  justify-self:end;
}
#brand {
  font-weight:800;
  letter-spacing:.06em;
  color:#777;
  text-decoration:none;
  white-space:nowrap;
}
#brand:hover { color:#fff; }
#current {
  color:#aaa;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:min(25vw,280px);
  font-size:11px;
  font-weight:400;
  letter-spacing:.065em;
  text-align:left;
  text-transform:uppercase;
}
#bar button {
  padding:5px 6px;
  white-space:nowrap;
}
#bar button:hover,
#bar button[aria-expanded="true"] {
  color:#fff;
}
#prev,#next {
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:30px;
}
.nav-arrow {
  width:12px;
  height:12px;
  display:block;
  fill:currentColor;
  stroke:none;
  flex-shrink:0;
}
#play {
  color:#fff!important;
  min-width:52px;
  font-size:11px;
  letter-spacing:.10em;
}
#shuffle {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:32px;
  padding:0!important;
}
.shuffle-icon {
  width:15px;
  height:15px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.35;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#shuffle[aria-pressed="true"] { color:#fff; }
#expand {
  font-size:12px;
  min-width:35px;
}

/* PLAYLIST DRAWER */

#drawer {
  position:fixed;
  bottom:var(--bar);
  left:0;
  right:0;
  height:min(52vh,470px);
  background:#030303;
  border-top:1px solid #404040;
  z-index:20;
  display:none;
  flex-direction:column;
}
#drawer.open { display:flex; }
#dhead {
  height:40px;
  min-height:40px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  font-size:11px;
  letter-spacing:.12em;
}
#dhead button { color:#777; }
#dcontent {
  display:grid;
  grid-template-columns:minmax(150px,32%) minmax(0,1fr);
  min-height:0;
  flex:1;
}
#sets,#tracks {
  overflow:auto;
  padding:13px;
  scrollbar-width:thin;
  scrollbar-color:#333 #000;
}
#sets { border-right:1px solid var(--line); }
.eyebrow {
  font-size:10px;
  color:#666;
  letter-spacing:.13em;
  margin:0 0 13px;
}
.set,.track {
  display:flex;
  align-items:center;
  width:100%;
  text-align:left;
  gap:12px;
  padding:11px 6px;
  border-bottom:1px solid #181818;
  color:#777;
  font-size:11px;
  letter-spacing:.06em;
}
.set:hover,.track:hover,
.set.active,.track.active { color:#fff; }
.count {
  margin-left:auto;
  color:#555;
  font-size:10px;
}
.number {
  color:#555;
  min-width:21px;
}
.trackname {
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.paneltools {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:13px 0;
}
.tiny {
  border:1px solid #363636;
  padding:6px 9px;
  color:#777;
  font-size:10px;
  letter-spacing:.07em;
}
.tiny:hover {
  border-color:#aaa;
  color:#fff;
}
.addrow {
  display:flex;
  gap:7px;
  border-top:1px solid var(--line);
  padding-top:13px;
  margin-top:14px;
}
.addrow input {
  background:#000;
  border:1px solid #303030;
  color:#eee;
  min-width:0;
  flex:1;
  padding:8px;
  font-size:11px;
}
.note {
  font-size:10px;
  color:#626262;
  line-height:1.65;
  max-width:600px;
}
#notice {
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 12px;
  background:#050505;
  border:1px solid #333;
  color:#aaa;
  font-size:10px;
  z-index:50;
  display:none;
  max-width:90vw;
  text-align:center;
}

/* MOBILE — SAME NAVIGATION SYMBOLS */

@media(max-width:650px) {
  #brand { font-size:9px; }
  #current { display:none; }
  #bar {
    padding:0 8px;
    grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  }
  #bar-left { gap:0; }
  #bar-center { gap:3px; }
  #bar-right { gap:2px; }
  #bar button { padding:5px 4px; }
  #prev,#next { min-width:18px; }
  .nav-arrow {
    width:12px;
    height:12px;
  }
  #play {
    min-width:42px;
    font-size:10px;
  }
  #shuffle {
    width:24px;
    min-width:24px;
  }
  .shuffle-icon {
    width:14px;
    height:14px;
  }
  #dcontent {
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr;
  }
  #sets {
    display:flex;
    align-items:center;
    gap:8px;
    overflow-x:auto;
    white-space:nowrap;
    border-right:0;
    border-bottom:1px solid var(--line);
    padding:8px;
  }
  #sets .eyebrow { display:none; }
  .set {
    width:auto;
    flex-shrink:0;
    white-space:nowrap;
    border:1px solid #222;
    padding:8px;
  }
  #drawer { height:min(67vh,550px); }
  #tracks { padding:10px; }
}
</style>
</head>

<body>
<main id="surface">
  <div id="empty">KETADATA / SURFACE</div>
  <iframe id="frame"
    title="Current KETADATA surface"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen></iframe>
  <video id="video" playsinline controls></video>
  <audio id="audio" controls></audio>
</main>

<div id="notice" role="status"></div>

<section id="drawer" aria-label="Surface playlists">
  <div id="dhead">
    <span>SURFACE / LIBRARY</span>
    <button id="collapseTop">[ CLOSE ]</button>
  </div>
  <div id="dcontent">
    <div id="sets"></div>
    <div id="tracks"></div>
  </div>
</section>

<footer id="bar">
  <div id="bar-left">
    <a id="brand"
      href="https://ketadata.com/index.html">
      KETADATA
    </a>
    <button id="current"
      title="Open current surface">
      —
    </button>
  </div>

  <div id="bar-center">
    <button id="prev"
      aria-label="Previous surface"
      title="Previous surface">
      <svg class="nav-arrow"
        viewBox="0 0 24 24"
        aria-hidden="true">
        <path d="M16.5 4.5 6.5 12l10 7.5Z"/>
      </svg>
    </button>

    <button id="play"
      aria-label="Play or reload">
      PLAY
    </button>

    <button id="next"
      aria-label="Next surface"
      title="Next surface">
      <svg class="nav-arrow"
        viewBox="0 0 24 24"
        aria-hidden="true">
        <path d="M7.5 4.5 17.5 12l-10 7.5Z"/>
      </svg>
    </button>
  </div>

  <div id="bar-right">
    <button id="shuffle"
      aria-label="Shuffle all surfaces"
      aria-pressed="false"
      title="Shuffle across all playlists">
      <svg class="shuffle-icon"
        viewBox="0 0 24 24"
        aria-hidden="true">
        <path d="M4 7h3c5 0 5 10 10 10h3"/>
        <path d="m17 14 3 3-3 3"/>
        <path d="M4 17h3c2.2 0 3.4-2 4.4-4"/>
        <path d="M14 8c.9-.7 1.8-1 3-1h3"/>
        <path d="m17 4 3 3-3 3"/>
      </svg>
    </button>

    <button id="full"
      aria-label="Fullscreen"
      title="Fullscreen">⛶</button>

    <button id="expand"
      aria-expanded="false"
      aria-controls="drawer"
      title="Expand library">[ + ]</button>
  </div>
</footer>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const BASE = 'https://ketadata.com/';
const KEY = 'KETADATA_SURFACE_PLAYER_CAPS_V3';

/*
COMPLETE LIBRARY
28 PLAYLISTS / 326 ENTRIES
REPEATED HTMLS PRESERVED.
*/

const LIBRARY = `
KETA-CORE|page2,crunch1,crunch1_old,ascii,ball,map,map1,cube,cube1,kitty,room,room_new,room_old,room_prev_recent,kdtv1,kdtv1_new,kdtv1_old,kdtv1_prev,kdtv1a,kdtv1b,vault,obscura
BLEAK-TECH|beatball,beatball_old,blacklotus2,bleak,bleak_old,chakra,chakra_old,chakra_recent
KETA-MINDS|artaud,artaud1,bataille,bataille1,burroughs,borges,debord,deleuze,deleuze1,mcluhan,goffman,goffman1,holzer,holzer1,jung,etal,land
KETA-ANIMA|butterfly,butterfly1,butterfly2,butterfly3,catball,catball1,catface,catface1,catface2,grace,grace1,grace3,kittycat,kittycat1,kittycat2,crow,snakes,fishtank,serp1,serpentine,lizard,octopus,leopard,pigface
KETA-INDEX|index,index0,index001,index002,index003,index005,index006,index007,index008,index009,index01,index011,index012,index013,index014,index015,index01_tester,index02,index03,index04,index05,index06,index07,index08,index09,index11,index11a,index11backup,index_copy,index_finalref,index_prev1,index_recent,indexbackup,indexcentertext,indexminimal,indexold,indexpixel,indexremake1,indexremake2
KETA-OBJECT|ashtray,ashtray1,coffee1,coffee,eye,eyes,mirror,mirror1,matchbook,matryoshka,molecule
KETA-MISC|misc,misc2,misc3,misc4,misc5,misc6,misc7,misc8
KETA-RELEASE|release,release2,release3,release4,wordbowl
KETA-SLOP|slopstream2,slopstream3,slopstream4,slopstream6,chroma
KETA-GPT|capture,capturegpt,capturegpt2,capturegpt3,capturegpt4,capturegpt5,capturegpt6,capturegpt7,capturegpt8,gptsubject
KETA-MOSH|datamosh,datamosh1,datamosh2,datamosh3,datamosh4,datamosher,datamosher1,datamosher2,datamosher3
K-MANDALA|mandala,mandala2,mandala3,mandala88,mandalagpt,mandalagpt2,mandalagpt3,mandalagpt4
KETA-TENNIS|ktball,ktball1,tennis,tennisball,tennisball0,tennisball10,tennisball11,tennisball12,tennisball13,tennisball14,tennisball15,tennisball16,tennisball2,tennisball3,tennisball4,tennisball5,tennisball6,tennisball666,tennisball7,tennisball8,tennisball9,tennisball91,tenniscourt,tball,tball1,tball2,tball3,tball4,tball5,tball6,tball7,serve,serve1,serve2
KETA-HIGH|mdma,mdma2,mdmagpt,mdmagpt2,subgpt2,subgpt3,subgpt4,subgpt5,dmt,dmt2,dmt3,dmt4,dmtzoom,drugprotocol
INFINITY POOL|pool,pool3,pool4,pool5,pool6,grotto,grotto1,grotto2,underwater,underwater1,infinity
HYPERSTITION|hyperstition,hyperstition1,hyperstition2,hyperstition3,hyperstition5
KETA-MOTION|motion1,motion10,motion11,motion2,motion3,motion4,motion5,motion6,motion7,motion8,motion9,growth,growth1,growth2,turbulence,motion
KETA-RIPPLE|ripple,ripple2,ripple3,ripplegpt
KETA-FUNNEL|funnel,funnel1,funnel2,funnel3,funnel4
KETA-ANNIVERSARY|aniversary1111,anniversary1,anniversary11,anniversary111
KETA-ORTHO|orthodox,orthodox1,orthodox2,orthodox3,orthodox,orthodox1,orthodox2,orthodox3
KETA-ADMIN|desktopbackup,desktoptester,desktoptester1,diekitty,consult,consult_old,consult_recent,consult_recenter,sensory3
K-TRAP|newtrap,newtrap2,newtrap3
K-DOT|polka1,polka2,polkadot
KETA-RED|red,red1,redroom
KETA-ASTRO|astro1,astro2,astro5
KETA-SCREEN|cctv1,cctv1,screen6,screenplane,screenplane1,video,video2,darkroom,darkroom1,sur_wall,video,video2
KETA-EPHEMERA|003,borromean,cp,cp1,depth,jan6,jan61,kmas,matrix,pulse,reading,sg,sg1,sovereignty,sublime,substance,substrate1,substrate3,target,target1,teleo,teleo1,temple,temple1,trace,widefield
`.trim();

/* PARSE LIBRARY */

const BUILTIN = LIBRARY.split('\n').map(line => {
  const separator = line.indexOf('|');
  const name = line.slice(0,separator);
  const filenames = line.slice(separator+1).split(',');
  return {
    name,
    items: filenames.map((file,i) => ({
      id:name+'-'+i,
      title:file+'.html',
      url:BASE+file+'.html',
      notes:''
    }))
  };
});

let saved = {};
try {
  saved = JSON.parse(localStorage.getItem(KEY)||'{}');
} catch {}

let collections =
  Array.isArray(saved.collections) && saved.collections.length
    ? saved.collections
    : structuredClone(BUILTIN);

let si =
  Number.isInteger(saved.si) &&
  saved.si >= 0 &&
  saved.si < collections.length
    ? saved.si : 0;

let ti = 0;
let activeKind = '';
let drawerOpen = false;
let shuffleOn = false;
let shuffleQueue = [];
let shufflePos = 0;

/* UTILITIES */

function persist() {
  try {
    localStorage.setItem(KEY,JSON.stringify({
      collections,si
    }));
  } catch {}
}

let noticeTimer;

function notify(message) {
  $('notice').textContent = message;
  $('notice').style.display = 'block';
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => {
    $('notice').style.display = 'none';
  },2200);
}

function normalizeUrl(raw) {
  try {
    const u = new URL(raw,BASE);
    return ['http:','https:'].includes(u.protocol)
      ? u.href : null;
  } catch {
    return null;
  }
}

function current() {
  return collections[si]?.items?.[ti]||null;
}

function filename(url) {
  try {
    return decodeURIComponent(
      new URL(url).pathname.split('/').pop()
    ).replace(/\.html$/i,'').toUpperCase();
  } catch {
    return 'SURFACE';
  }
}

function mediaKind(url) {
  const path = new URL(url).pathname.toLowerCase();
  if (/\.(mp4|webm|ogv)$/.test(path)) return 'video';
  if (/\.(mp3|wav|ogg|m4a)$/.test(path)) return 'audio';
  return 'frame';
}

/* SURFACE LOADER */

function unload() {
  for (const kind of ['frame','video','audio']) {
    const el = $(kind);
    el.classList.remove('on');
    if (kind === 'frame') {
      el.removeAttribute('src');
    } else {
      el.pause();
      el.removeAttribute('src');
      el.load();
    }
  }
  $('empty').classList.remove('hide');
  activeKind = '';
}

function load() {
  unload();

  const item = current();
  if (!item) {
    $('current').textContent = '—';
    $('play').textContent = 'PLAY';
    render();
    return;
  }

  const url = normalizeUrl(item.url);
  if (!url) {
    notify('INVALID SURFACE URL');
    return;
  }

  activeKind = mediaKind(url);

  $(activeKind).src = url;
  $(activeKind).classList.add('on');
  $('empty').classList.add('hide');

  $('current').textContent = filename(url);
  $('current').title = url;

  $('play').textContent =
    activeKind === 'frame' ? 'RELOAD' : 'PAUSE';

  if (activeKind !== 'frame') {
    $(activeKind).play().catch(() => {
      $('play').textContent = 'PLAY';
    });
  }
  render();
}

function choose(index) {
  const items = collections[si]?.items||[];
  if (!items.length) return;
  ti = (index+items.length)%items.length;
  persist();
  load();
}

function togglePlay() {
  if (!activeKind || activeKind === 'frame') {
    load();
    return;
  }
  const el = $(activeKind);
  if (el.paused) {
    el.play().then(() => {
      $('play').textContent = 'PAUSE';
    }).catch(() => notify('PLAYBACK BLOCKED'));
  } else {
    el.pause();
    $('play').textContent = 'PLAY';
  }
}

/* SHUFFLE ACROSS ALL PLAYLISTS */

function allPositions() {
  const positions = [];
  collections.forEach((set,setIndex) => {
    (set.items||[]).forEach((item,trackIndex) => {
      if (item.url) {
        positions.push({
          si:setIndex,
          ti:trackIndex
        });
      }
    });
  });
  return positions;
}

function randomize(items) {
  const result = [...items];
  for (let i=result.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [result[i],result[j]] = [result[j],result[i]];
  }
  return result;
}

function setShuffle(value) {
  shuffleOn = !!value;
  $('shuffle').setAttribute(
    'aria-pressed',String(shuffleOn)
  );

  if (shuffleOn) {
    shuffleQueue = [
      {si,ti},
      ...randomize(allPositions().filter(
        p => !(p.si===si && p.ti===ti)
      ))
    ];
    shufflePos = 0;
    notify('SHUFFLE / ALL SURFACES');
  } else {
    shuffleQueue = [];
    shufflePos = 0;
    notify('SHUFFLE / OFF');
  }
}

function navigate(direction) {
  if (!shuffleOn) {
    choose(ti+direction);
    return;
  }

  if (direction<0 && shufflePos===0) return;

  if (direction>0 &&
      shufflePos===shuffleQueue.length-1) {
    shuffleQueue.push(...randomize(
      allPositions().filter(
        p => !(p.si===si && p.ti===ti)
      )
    ));
  }

  shufflePos += direction;
  const position = shuffleQueue[shufflePos];
  if (!position) return;

  si = position.si;
  ti = position.ti;
  persist();
  load();
}

/* LIBRARY DRAWER */

function toggleDrawer(value=!drawerOpen) {
  drawerOpen = value;
  $('drawer').classList.toggle('open',drawerOpen);
  $('expand').setAttribute(
    'aria-expanded',String(drawerOpen)
  );
  $('expand').textContent =
    drawerOpen ? '[ − ]' : '[ + ]';
}

function render() {
  const sets = $('sets');
  sets.replaceChildren();

  const heading = document.createElement('p');
  heading.className = 'eyebrow';
  heading.textContent = 'PLAYLISTS';
  sets.append(heading);

  collections.forEach((set,index) => {
    const button = document.createElement('button');
    button.className =
      'set'+(index===si?' active':'');

    const name = document.createElement('span');
    name.textContent = set.name;

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = set.items.length;

    button.append(name,count);
    button.onclick = () => {
      if (shuffleOn) setShuffle(false);
      si = index;
      ti = 0;
      persist();
      load();
    };
    sets.append(button);
  });

  const tracks = $('tracks');
  tracks.replaceChildren();

  const label = document.createElement('p');
  label.className = 'eyebrow';
  label.textContent =
    'SURFACES / '+(collections[si]?.name||'');
  tracks.append(label);

  (collections[si]?.items||[]).forEach((item,index) => {
    const button = document.createElement('button');
    button.className =
      'track'+(index===ti?' active':'');

    const num = document.createElement('span');
    num.className = 'number';
    num.textContent = String(index+1).padStart(2,'0');

    const name = document.createElement('span');
    name.className = 'trackname';
    name.textContent = filename(item.url);

    button.append(num,name);
    button.onclick = () => {
      if (shuffleOn) setShuffle(false);
      choose(index);
    };
    tracks.append(button);
  });

  const tools = document.createElement('div');
  tools.className = 'paneltools';

  const newSet = document.createElement('button');
  newSet.className = 'tiny';
  newSet.textContent = '+ PLAYLIST';
  newSet.onclick = () => {
    const name = prompt('PLAYLIST NAME');
    if (!name?.trim()) return;

    if (shuffleOn) setShuffle(false);

    collections.push({
      name:name.trim().toUpperCase(),
      items:[]
    });
    si = collections.length-1;
    ti = 0;
    persist();
    load();
  };

  const remove = document.createElement('button');
  remove.className = 'tiny';
  remove.textContent = 'REMOVE CURRENT';
  remove.onclick = () => {
    const arr = collections[si]?.items;
    if (!arr?.length) return;
    if (!confirm('REMOVE CURRENT SURFACE?')) return;
    if (shuffleOn) setShuffle(false);
    arr.splice(ti,1);
    ti = Math.max(0,Math.min(ti,arr.length-1));
    persist();
    load();
  };

  tools.append(newSet,remove);
  tracks.append(tools);

  const form = document.createElement('form');
  form.className = 'addrow';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'URL / HTML FILENAME';
  input.setAttribute('aria-label','Surface URL');

  const add = document.createElement('button');
  add.type = 'submit';
  add.textContent = 'ADD';
  form.append(input,add);

  form.onsubmit = e => {
    e.preventDefault();
    let raw = input.value.trim();
    if (!raw) return;

    if (!raw.includes('/') && !raw.includes('.')) {
      raw += '.html';
    }

    const url = normalizeUrl(raw);
    if (!url) {
      notify('INVALID SURFACE URL');
      return;
    }

    if (shuffleOn) setShuffle(false);

    collections[si].items.push({
      title:filename(url),
      url,
      notes:''
    });

    ti = collections[si].items.length-1;
    persist();
    load();
  };
  tracks.append(form);

  const hint = document.createElement('p');
  hint.className = 'note';
  hint.textContent =
    'SHUFFLE RANDOMIZES ALL SURFACES. '+
    'PREVIOUS RETRACES SHUFFLE HISTORY. '+
    'HTML SURFACES RELOAD RATHER THAN PAUSE. '+
    'LIBRARY CHANGES ARE SAVED LOCALLY.';
  tracks.append(hint);
}

/* CONTROLS */

$('prev').onclick = () => navigate(-1);
$('next').onclick = () => navigate(1);
$('play').onclick = togglePlay;
$('shuffle').onclick = () => setShuffle(!shuffleOn);
$('expand').onclick = () => toggleDrawer();
$('collapseTop').onclick = () => toggleDrawer(false);

$('current').onclick = () => {
  const item = current();
  if (item) {
    window.open(
      item.url,'_blank','noopener,noreferrer'
    );
  }
};

$('full').onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch {
    notify('FULLSCREEN UNAVAILABLE');
  }
};

/* KEYBOARD */

document.addEventListener('keydown',e => {
  if (['INPUT','TEXTAREA'].includes(
    document.activeElement?.tagName
  )) return;

  if (e.key==='ArrowRight') navigate(1);
  if (e.key==='ArrowLeft') navigate(-1);

  if (e.key===' ') {
    e.preventDefault();
    togglePlay();
  }

  if (e.key==='Escape') toggleDrawer(false);
  if (e.key.toLowerCase()==='p') toggleDrawer();
  if (e.key.toLowerCase()==='s') {
    setShuffle(!shuffleOn);
  }
});

/* DEEP LINKS */

const query = new URLSearchParams(location.search);
const qset = query.get('set');
const qsurf = query.get('surface');

if (qset!==null) {
  const n = Number(qset);
  if (Number.isInteger(n) &&
      n>=0 && n<collections.length) {
    si = n;
  }
}

if (qsurf!==null) {
  const n = Number(qsurf);
  if (Number.isInteger(n) &&
      n>=0 &&
      n<(collections[si]?.items.length||0)) {
    ti = n;
  }
}

/* INITIALIZE */

load();

})();
</script>
</body>
</html>
