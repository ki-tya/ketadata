
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KETADATA / SURFACE PLAYER</title>

<style>
:root {
  color-scheme: dark;
  --bar: 46px;
  --line: #292929;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

button, input { font: inherit; }

button {
  background: none;
  border: 0;
  color: #777;
  cursor: pointer;
}

button:hover, button.active { color: #fff; }

button:focus-visible, a:focus-visible,
input:focus-visible {
  outline: 1px solid #aaa;
  outline-offset: 2px;
}

/* SURFACE */

#surface {
  position: fixed;
  inset: 0 0 var(--bar);
  background: #000;
}

#frame, #video, #audio {
  width: 100%;
  height: 100%;
  border: 0;
  display: none;
  background: #000;
}

#frame.on, #video.on, #audio.on {
  display: block;
}

#empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #555;
  font-size: 11px;
  letter-spacing: .16em;
  pointer-events: none;
}

#empty.hide { display: none; }

/* BOTTOM BAR */

#bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--bar);
  background: #000;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
  align-items: center;
  padding: 0 15px;
  z-index: 30;
  font-size: 11px;
  letter-spacing: .06em;
}

#left, #center, #right {
  display: flex;
  align-items: center;
  min-width: 0;
}

#left {
  gap: 17px;
  justify-self: start;
  overflow: hidden;
}

#center {
  gap: 14px;
  justify-self: center;
}

#right {
  gap: 10px;
  justify-self: end;
}

#brand {
  font-weight: 800;
  text-decoration: none;
  color: #777;
  white-space: nowrap;
  letter-spacing: .06em;
}

#brand:hover { color: #fff; }

#filename {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: #aaa;
  padding: 5px 0;
  text-align: left;
  min-width: 0;
  font-size: 11px;
}

#bar button:hover { color: #fff; }

.nav {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 30px;
  padding: 0;
}

.nav svg, .iconbutton svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.35;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#play {
  color: #fff;
  font-size: 10px;
  letter-spacing: .1em;
  min-width: 52px;
  padding: 6px 2px;
}

.iconbutton {
  width: 25px;
  height: 30px;
  display: grid;
  place-items: center;
  padding: 0;
}

#shuffle[aria-pressed="true"] {
  color: #fff;
}

#expand {
  font-size: 11px;
  white-space: nowrap;
  min-width: 32px;
  padding: 5px 0;
}

/* LIBRARY */

#drawer {
  position: fixed;
  bottom: var(--bar);
  left: 0;
  right: 0;
  height: min(58vh,500px);
  background: #030303;
  border-top: 1px solid #444;
  display: none;
  flex-direction: column;
  z-index: 20;
}

#drawer.open { display: flex; }

#drawerhead {
  height: 42px;
  min-height: 42px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  font-size: 10px;
  letter-spacing: .12em;
}

#drawerhead button { font-size: 10px; }

#library {
  display: grid;
  grid-template-columns: minmax(160px,30%) minmax(0,1fr);
  min-height: 0;
  flex: 1;
}

#sets, #tracks {
  overflow: auto;
  padding: 13px;
  scrollbar-width: thin;
  scrollbar-color: #333 #000;
}

#sets { border-right: 1px solid var(--line); }

.eyebrow {
  color: #666;
  font-size: 10px;
  letter-spacing: .12em;
  margin: 0 0 13px;
}

.set, .track {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 11px 6px;
  border-bottom: 1px solid #181818;
  font-size: 11px;
  letter-spacing: .05em;
}

.set.active, .track.active,
.set:hover, .track:hover {
  color: #fff;
}

.count {
  margin-left: auto;
  color: #555;
  font-size: 10px;
}

.number {
  min-width: 25px;
  color: #555;
}

.trackname {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.tools {
  display: flex;
  gap: 8px;
  margin: 16px 0 12px;
  flex-wrap: wrap;
}

.tiny {
  border: 1px solid #333;
  color: #888;
  padding: 7px 10px;
  font-size: 10px;
}

.tiny:hover {
  border-color: #aaa;
  color: #fff;
}

.addrow {
  display: flex;
  gap: 8px;
}

.addrow input {
  min-width: 0;
  flex: 1;
  background: #000;
  color: #fff;
  border: 1px solid #333;
  padding: 9px;
  font-size: 11px;
}

.note {
  color: #666;
  font-size: 10px;
  line-height: 1.7;
  margin-top: 15px;
}

#notice {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: #050505;
  border: 1px solid #333;
  padding: 9px 13px;
  font-size: 10px;
  color: #aaa;
  z-index: 60;
  display: none;
  text-align: center;
}

/* MOBILE */

@media(max-width:650px) {
  :root { --bar: 46px; }

  #bar { padding: 0 9px; }

  #left { gap: 7px; }

  #brand { font-size: 9px; }

  #filename {
    font-size: 9px;
    max-width: 21vw;
  }

  #center { gap: 4px; }
  #right { gap: 4px; }

  .nav {
    width: 21px;
    height: 32px;
  }

  .nav svg {
    width: 15px;
    height: 15px;
  }

  #play {
    min-width: 43px;
    font-size: 9px;
  }

  .iconbutton {
    width: 23px;
  }

  .iconbutton svg {
    width: 15px;
    height: 15px;
  }

  #expand {
    min-width: 27px;
    font-size: 10px;
  }

  #drawer {
    height: min(72vh,650px);
  }

  #library {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }

  #sets {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 9px;
    white-space: nowrap;
  }

  #sets .eyebrow { display: none; }

  .set {
    width: auto;
    flex-shrink: 0;
    border: 1px solid #222;
    padding: 9px;
  }

  .set .count { margin-left: 5px; }

  #tracks { padding: 10px; }
}
</style>
</head>

<body>

<main id="surface">
  <div id="empty">KETADATA / SURFACE</div>
  <iframe id="frame"
    title="KETADATA Surface"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen></iframe>
  <video id="video" playsinline controls></video>
  <audio id="audio" controls></audio>
</main>

<div id="notice" role="status"></div>

<section id="drawer" aria-label="Surface library">
  <div id="drawerhead">
    <span>SURFACE / LIBRARY</span>
    <button id="close">[ CLOSE ]</button>
  </div>
  <div id="library">
    <div id="sets"></div>
    <div id="tracks"></div>
  </div>
</section>

<footer id="bar">

  <div id="left">
    <a id="brand"
      href="https://ketadata.com/index.html">
      KETADATA
    </a>
    <button id="filename"
      title="Open current surface in new tab">
      —
    </button>
  </div>

  <div id="center">

    <button id="prev" class="nav"
      aria-label="Previous surface">
      <svg viewBox="0 0 24 24">
        <path d="m15 5-7 7 7 7"/>
      </svg>
    </button>

    <button id="play">PLAY</button>

    <button id="next" class="nav"
      aria-label="Next surface">
      <svg viewBox="0 0 24 24">
        <path d="m9 5 7 7-7 7"/>
      </svg>
    </button>

  </div>

  <div id="right">

    <button id="shuffle"
      class="iconbutton"
      aria-label="Shuffle all surfaces"
      aria-pressed="false"
      title="Shuffle all playlists">
      <svg viewBox="0 0 24 24">
        <path d="M4 7h3c5 0 5 10 10 10h3"/>
        <path d="m17 14 3 3-3 3"/>
        <path d="M4 17h3c2.2 0 3.4-2 4.4-4"/>
        <path d="M14 8c.9-.7 1.8-1 3-1h3"/>
        <path d="m17 4 3 3-3 3"/>
      </svg>
    </button>

    <button id="full"
      class="iconbutton"
      aria-label="Fullscreen">
      <svg viewBox="0 0 24 24">
        <path d="M8 3H3v5M16 3h5v5
                 M3 16v5h5M21 16v5h-5"/>
      </svg>
    </button>

    <button id="expand"
      aria-expanded="false"
      aria-controls="drawer">
      [ + ]
    </button>

  </div>
</footer>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const BASE = 'https://ketadata.com/';
const KEY = 'KETADATA_SURFACE_28_GLOBAL_V2';

/*
  COMPLETE PLAYLIST LIBRARY
  28 PLAYLISTS / 326 ENTRIES

  EACH COMMA-SEPARATED ITEM IS ONE HTML.
  ORIGINAL REPEATED ENTRIES ARE PRESERVED.
*/

const LIBRARY = `
KETA-CORE|page2,crunch1,crunch1_old,ascii,ball,map,map1,cube,cube1,kitty,room,room_new,room_old,room_prev_recent,kdtv1,kdtv1_new,kdtv1_old,kdtv1_prev,kdtv1a,kdtv1b,vault,obscura
BLEAK-TECH|beatball,beatball_old,blacklotus2,bleak,bleak_old,chakra,chakra_old,chakra_recent
KETA-MINDS|artaud,artaud1,bataille,bataille1,burroughs,borges,debord,deleuze,deleuze1,mcluhan,goffman,goffman1,holzer,holzer1,jung,etal,land
KETA-ANIMA|butterfly,butterfly1,butterfly2,butterfly3,catball,catball1,catface,catface1,catface2,grace,grace1,grace3,kittycat,kittycat1,kittycat2,crow,snakes,fishtank,serp1,serpentine,lizard,octopus,leopard,pigface
KETA-INDEX|index,index0,index001,index002,index003,index005,index006,index007,index008,index009,index01,index011,index012,index013,index014,index015,index01_tester,index02,index03,index04,index05,index06,index07,index08,index09,index11,index11a,index11backup,index_copy,index_finalref,index_prev1,index_recent,indexbackup,indexcentertext,indexminimal,indexold,indexpixel,indexremake1,indexremake2
KETA-OBJECT|ashtray,ashtray1,coffee1,coffee,eye,eyes,mirror,mirror1,matchbook,matryoshka,molecule
KETA-MISC|misc,misc2,misc3,misc4,misc5,misc6,misc7,misc8
KETA-RELEASE|release,release2,release3,release4,wordbowl
KETA-SLOP|slopstream2,slopstream3,slopstream4,slopstream6,chroma
KETA-GPT|capture,capturegpt,capturegpt2,capturegpt3,capturegpt4,capturegpt5,capturegpt6,capturegpt7,capturegpt8,gptsubject
KETA-MOSH|datamosh,datamosh1,datamosh2,datamosh3,datamosh4,datamosher,datamosher1,datamosher2,datamosher3
K-MANDALA|mandala,mandala2,mandala3,mandala88,mandalagpt,mandalagpt2,mandalagpt3,mandalagpt4
KETA-TENNIS|ktball,ktball1,tennis,tennisball,tennisball0,tennisball10,tennisball11,tennisball12,tennisball13,tennisball14,tennisball15,tennisball16,tennisball2,tennisball3,tennisball4,tennisball5,tennisball6,tennisball666,tennisball7,tennisball8,tennisball9,tennisball91,tenniscourt,tball,tball1,tball2,tball3,tball4,tball5,tball6,tball7,serve,serve1,serve2
KETA-HIGH|mdma,mdma2,mdmagpt,mdmagpt2,subgpt2,subgpt3,subgpt4,subgpt5,dmt,dmt2,dmt3,dmt4,dmtzoom,drugprotocol
INFINITY POOL|pool,pool3,pool4,pool5,pool6,grotto,grotto1,grotto2,underwater,underwater1,infinity
HYPERSTITION|hyperstition,hyperstition1,hyperstition2,hyperstition3,hyperstition5
KETA-MOTION|motion1,motion10,motion11,motion2,motion3,motion4,motion5,motion6,motion7,motion8,motion9,growth,growth1,growth2,turbulence,motion
KETA-RIPPLE|ripple,ripple2,ripple3,ripplegpt
KETA-FUNNEL|funnel,funnel1,funnel2,funnel3,funnel4
KETA-ANNIVERSARY|aniversary1111,anniversary1,anniversary11,anniversary111
KETA-ORTHO|orthodox,orthodox1,orthodox2,orthodox3,orthodox,orthodox1,orthodox2,orthodox3
KETA-ADMIN|desktopbackup,desktoptester,desktoptester1,diekitty,consult,consult_old,consult_recent,consult_recenter,sensory3
K-TRAP|newtrap,newtrap2,newtrap3
K-DOT|polka1,polka2,polkadot
KETA-RED|red,red1,redroom
KETA-ASTRO|astro1,astro2,astro5
KETA-SCREEN|cctv1,cctv1,screen6,screenplane,screenplane1,video,video2,darkroom,darkroom1,sur_wall,video,video2
KETA-EPHEMERA|003,borromean,cp,cp1,depth,jan6,jan61,kmas,matrix,pulse,reading,sg,sg1,sovereignty,sublime,substance,substrate1,substrate3,target,target1,teleo,teleo1,temple,temple1,trace,widefield
`.trim();

/* PARSE THE LIBRARY */

const BUILTIN = LIBRARY.split('\n').map(line => {
  const divider = line.indexOf('|');
  const name = line.slice(0,divider);
  const files = line.slice(divider+1).split(',');

  return {
    name,
    items: files.map((file,index) => ({
      id: name+'-'+index,
      title: file,
      url: BASE+file+'.html'
    }))
  };
});

/* SAVED LIBRARY */

let saved = {};

try {
  saved = JSON.parse(localStorage.getItem(KEY) || '{}');
} catch {}

let collections =
  Array.isArray(saved.collections) &&
  saved.collections.length
    ? saved.collections
    : structuredClone(BUILTIN);

let si =
  Number.isInteger(saved.si) &&
  saved.si >= 0 &&
  saved.si < collections.length
    ? saved.si : 0;

let ti = 0;
let activeKind = '';
let drawerOpen = false;

/* SHUFFLE STATE */

let shuffleOn = false;
let shuffleQueue = [];
let shufflePos = 0;

/* SAVE */

function persist() {
  try {
    localStorage.setItem(KEY,JSON.stringify({
      collections,si
    }));
  } catch {}
}

/* NOTIFICATIONS */

let noticeTimer;

function notify(message) {
  $('notice').textContent = message;
  $('notice').style.display = 'block';

  clearTimeout(noticeTimer);

  noticeTimer = setTimeout(() => {
    $('notice').style.display = 'none';
  },2200);
}

/* CURRENT SURFACE */

function current() {
  return collections[si]?.items?.[ti] || null;
}

function filename(url) {
  try {
    return decodeURIComponent(
      new URL(url).pathname.split('/').pop()
    ).replace(/\.html?$/i,'') || 'SURFACE';
  } catch {
    return 'SURFACE';
  }
}

/* MEDIA TYPE */

function mediaKind(url) {
  let path = '';

  try {
    path = new URL(url).pathname.toLowerCase();
  } catch {}

  if (/\.(mp4|webm|ogv)$/.test(path)) {
    return 'video';
  }

  if (/\.(mp3|wav|ogg|m4a)$/.test(path)) {
    return 'audio';
  }

  return 'frame';
}

function normalizeUrl(raw) {
  try {
    const u = new URL(raw,BASE);
    return ['https:','http:'].includes(u.protocol)
      ? u.href : null;
  } catch {
    return null;
  }
}

/* UNLOAD CURRENT SURFACE */

function unload() {
  for (const kind of ['frame','video','audio']) {
    const el = $(kind);
    el.classList.remove('on');

    if (kind === 'frame') {
      el.removeAttribute('src');
    } else {
      el.pause();
      el.removeAttribute('src');
      el.load();
    }
  }

  $('empty').classList.remove('hide');
  activeKind = '';
}

/* LOAD SURFACE */

function load() {
  unload();

  const item = current();

  if (!item) {
    $('filename').textContent = '—';
    $('play').textContent = 'PLAY';
    render();
    return;
  }

  const url = normalizeUrl(item.url);

  if (!url) {
    notify('INVALID SURFACE URL');
    return;
  }

  const kind = mediaKind(url);
  activeKind = kind;

  $(kind).src = url;
  $(kind).classList.add('on');
  $('empty').classList.add('hide');

  $('filename').textContent = filename(url);
  $('filename').title = url;

  $('play').textContent =
    kind === 'frame' ? 'RELOAD' : 'PAUSE';

  if (kind !== 'frame') {
    $(kind).play().catch(() => {
      $('play').textContent = 'PLAY';
    });
  }

  render();
}

/* CHOOSE TRACK */

function choose(index) {
  const items = collections[si]?.items || [];

  if (!items.length) return;

  ti = (index + items.length) % items.length;
  persist();
  load();
}

/* PLAY / RELOAD */

function togglePlay() {
  if (!activeKind || activeKind === 'frame') {
    load();
    return;
  }

  const el = $(activeKind);

  if (el.paused) {
    el.play().then(() => {
      $('play').textContent = 'PAUSE';
    }).catch(() => {
      notify('PLAYBACK BLOCKED');
    });
  } else {
    el.pause();
    $('play').textContent = 'PLAY';
  }
}

/* ALL SURFACE POSITIONS */

function allPositions() {
  const positions = [];

  collections.forEach((set,setIndex) => {
    (set.items || []).forEach((item,trackIndex) => {
      if (item.url) {
        positions.push({
          si:setIndex,
          ti:trackIndex
        });
      }
    });
  });

  return positions;
}

/* FISHER-YATES SHUFFLE */

function randomize(items) {
  const array = [...items];

  for (let i=array.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));

    [array[i],array[j]] =
      [array[j],array[i]];
  }

  return array;
}

/* ENABLE / DISABLE GLOBAL SHUFFLE */

function setShuffle(on) {
  shuffleOn = !!on;

  $('shuffle').setAttribute(
    'aria-pressed',String(shuffleOn)
  );

  $('shuffle').classList.toggle(
    'active',shuffleOn
  );

  if (shuffleOn) {
    const positions = allPositions().filter(
      p => !(p.si === si && p.ti === ti)
    );

    shuffleQueue = [
      {si,ti},
      ...randomize(positions)
    ];

    shufflePos = 0;

    notify('SHUFFLE / ALL SURFACES');
  } else {
    shuffleQueue = [];
    shufflePos = 0;

    notify('SHUFFLE / OFF');
  }
}

/* NEXT / PREVIOUS */

function navigate(direction) {
  if (!shuffleOn) {
    choose(ti+direction);
    return;
  }

  if (direction < 0 && shufflePos === 0) {
    return;
  }

  if (
    direction > 0 &&
    shufflePos >= shuffleQueue.length-1
  ) {
    const nextCycle = randomize(
      allPositions().filter(
        p => !(p.si === si && p.ti === ti)
      )
    );

    shuffleQueue.push(...nextCycle);
  }

  shufflePos += direction;

  const position = shuffleQueue[shufflePos];

  if (!position) return;

  si = position.si;
  ti = position.ti;

  persist();
  load();
}

/* DRAWER */

function toggleDrawer(value = !drawerOpen) {
  drawerOpen = value;

  $('drawer').classList.toggle(
    'open',drawerOpen
  );

  $('expand').setAttribute(
    'aria-expanded',String(drawerOpen)
  );

  $('expand').textContent =
    drawerOpen ? '[ − ]' : '[ + ]';
}

/* RENDER LIBRARY */

function render() {
  const sets = $('sets');
  sets.replaceChildren();

  const heading = document.createElement('div');
  heading.className = 'eyebrow';
  heading.textContent = 'PLAYLISTS';
  sets.append(heading);

  collections.forEach((set,i) => {
    const button = document.createElement('button');

    button.className =
      'set'+(si===i?' active':'');

    const name = document.createElement('span');
    name.textContent = set.name;

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = set.items.length;

    button.append(name,count);

    button.onclick = () => {
      if (shuffleOn) setShuffle(false);
      si = i;
      ti = 0;
      persist();
      load();
    };

    sets.append(button);
  });

  const tracks = $('tracks');
  tracks.replaceChildren();

  const label = document.createElement('p');
  label.className = 'eyebrow';
  label.textContent =
    'SURFACES / '+collections[si]?.name;

  tracks.append(label);

  (collections[si]?.items || []).forEach((item,i) => {
    const button = document.createElement('button');

    button.className =
      'track'+(ti===i?' active':'');

    const number = document.createElement('span');
    number.className = 'number';
    number.textContent =
      String(i+1).padStart(2,'0');

    const name = document.createElement('span');
    name.className = 'trackname';
    name.textContent = filename(item.url);

    button.append(number,name);

    button.onclick = () => {
      if (shuffleOn) setShuffle(false);
      choose(i);
    };

    tracks.append(button);
  });

  /* EDITING CONTROLS */

  const tools = document.createElement('div');
  tools.className = 'tools';

  const newSet = document.createElement('button');
  newSet.className = 'tiny';
  newSet.textContent = '+ PLAYLIST';

  newSet.onclick = () => {
    const name = prompt('PLAYLIST NAME');
    if (!name?.trim()) return;

    if (shuffleOn) setShuffle(false);

    collections.push({
      name:name.trim().toUpperCase(),
      items:[]
    });

    si = collections.length-1;
    ti = 0;

    persist();
    load();
  };

  const remove = document.createElement('button');
  remove.className = 'tiny';
  remove.textContent = 'REMOVE CURRENT';

  remove.onclick = () => {
    const arr = collections[si]?.items;
    if (!arr?.length) return;

    if (!confirm('REMOVE CURRENT SURFACE?')) {
      return;
    }

    if (shuffleOn) setShuffle(false);

    arr.splice(ti,1);
    ti = Math.max(0,Math.min(ti,arr.length-1));

    persist();
    load();
  };

  tools.append(newSet,remove);
  tracks.append(tools);

  /* ADD SURFACE */

  const form = document.createElement('form');
  form.className = 'addrow';

  const input = document.createElement('input');
  input.placeholder = 'URL / HTML FILENAME';
  input.setAttribute(
    'aria-label','New surface URL'
  );

  const add = document.createElement('button');
  add.className = 'tiny';
  add.type = 'submit';
  add.textContent = 'ADD';

  form.append(input,add);

  form.onsubmit = e => {
    e.preventDefault();

    let raw = input.value.trim();

    if (!raw) return;

    if (
      !raw.includes('/') &&
      !raw.includes('.')
    ) {
      raw += '.html';
    }

    const url = normalizeUrl(raw);

    if (!url) {
      notify('INVALID URL');
      return;
    }

    if (shuffleOn) setShuffle(false);

    collections[si].items.push({
      title:filename(url),
      url
    });

    ti = collections[si].items.length-1;

    persist();
    load();
  };

  tracks.append(form);

  const hint = document.createElement('p');
  hint.className = 'note';

  hint.textContent =
    'SHUFFLE RANDOMIZES ALL PLAYLISTS. '+
    'PREVIOUS RETRACES SHUFFLE HISTORY. '+
    'HTML SURFACES RELOAD RATHER THAN PAUSE. '+
    'LIBRARY EDITS ARE SAVED IN THIS BROWSER.';

  tracks.append(hint);
}

/* BUTTON EVENTS */

$('prev').onclick = () => navigate(-1);
$('next').onclick = () => navigate(1);
$('play').onclick = togglePlay;

$('shuffle').onclick = () =>
  setShuffle(!shuffleOn);

$('expand').onclick = () => toggleDrawer();
$('close').onclick = () => toggleDrawer(false);

$('filename').onclick = () => {
  const item = current();

  if (item) {
    window.open(
      item.url,'_blank','noopener,noreferrer'
    );
  }
};

$('full').onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch {
    notify('FULLSCREEN UNAVAILABLE');
  }
};

/* KEYBOARD NAVIGATION */

document.addEventListener('keydown',e => {
  if (
    ['INPUT','TEXTAREA'].includes(
      document.activeElement?.tagName
    )
  ) return;

  if (e.key === 'ArrowRight') {
    navigate(1);
  }

  if (e.key === 'ArrowLeft') {
    navigate(-1);
  }

  if (e.key === ' ') {
    e.preventDefault();
    togglePlay();
  }

  if (e.key === 'Escape') {
    toggleDrawer(false);
  }

  if (e.key.toLowerCase() === 'p') {
    toggleDrawer();
  }

  if (e.key.toLowerCase() === 's') {
    setShuffle(!shuffleOn);
  }
});

/* OPTIONAL DEEP LINKS */

const query = new URLSearchParams(location.search);
const qset = query.get('set');
const qsurf = query.get('surface');

if (qset !== null) {
  const n = Number(qset);

  if (
    Number.isInteger(n) &&
    n >= 0 &&
    n < collections.length
  ) {
    si = n;
  }
}

if (qsurf !== null) {
  const n = Number(qsurf);

  if (
    Number.isInteger(n) &&
    n >= 0 &&
    n < (collections[si]?.items.length || 0)
  ) {
    ti = n;
  }
}

/* INITIALIZE */

load();

})();
</script>
</body>
</html>
