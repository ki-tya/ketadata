
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KETADATA</title>
<style>
html, body {
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:black;
  color:white;
}
body {
  font-family:Arial,sans-serif;
  text-align:center;
  padding-top:0;
}
h1 {
  margin:0;
  font-weight:800;
  letter-spacing:0.02em;
  line-height:0.9;
  z-index:10;
  position:fixed;
  left:0;
  width:100%;
  top:50%;
  transform:translateY(calc(-50% + 4.5vh));
}
#ketaWord {
  width:96vw;
  max-width:1800px;
  margin:0 auto;
  font-size:clamp(8rem,15vw,17rem);
  cursor:pointer;
  user-select:none;
  position:relative;
}
.word-row {
  display:flex;
  justify-content:center;
  align-items:baseline;
}
.word-row.single { display:flex; }
.word-row.split { display:none; }
#ketaWord .cell {
  flex:1 1 0;
  display:flex;
  justify-content:center;
  align-items:baseline;
  min-width:0;
}
#ketaWord .ch {
  display:inline-block;
  width:1ch;
  text-align:center;
  line-height:1;
}
.bridge {
  height:9vh;
  position:relative;
  width:100%;
}
#base-link {
  position:absolute;
  left:50%;
  top:101%;
  transform:translate(-50%,-50%);
  display:block;
  width:52vw;
  background:transparent;
  color:transparent;
  text-decoration:none;
  font-size:1.9rem;
  font-weight:900;
  font-family:Arial Black,Arial,sans-serif;
  letter-spacing:0.14em;
  line-height:1;
  text-transform:uppercase;
  opacity:0;
  pointer-events:none;
  transition:
    opacity .08s linear,
    -webkit-text-stroke-color .08s linear;
  z-index:50;
  -webkit-text-stroke:1.8px rgba(255,255,255,.98);
  text-shadow:none;
}
body.strobe-active #base-link {
  opacity:1;
  pointer-events:auto;
}
body.clicking-base #base-link {
  -webkit-text-stroke-color:black;
}
#warning {
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:132px;
  width:min(96vw,1400px);
  pointer-events:none;
  z-index:10;
  color:#5555;
  font-size:1.5rem;
  margin:0;
  line-height:1.6;
}
#isolatedSlash {
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#fff;
  font-family:Arial,sans-serif;
  font-weight:800;
  line-height:1;
  opacity:0;
  z-index:999;
  pointer-events:none;
  text-shadow:none;
}
body.entering #ketaWord,
body.entering .bridge,
body.entering #warning {
  opacity:0;
  transition:opacity 120ms linear;
}
#blackout {
  position:fixed;
  inset:0;
  background:#000;
  opacity:0;
  z-index:998;
  pointer-events:none;
  transition:opacity 80ms linear;
}
body.blacked #blackout { opacity:1; }

@media(max-width:760px) {
  body { padding-top:0; }
  .word-row.single { display:none; }
  .word-row.split { display:flex; }
  #base-link {
    width:90vw;
    font-size:1.1rem;
  }
  #warning {
    width:88vw;
    font-size:0.9rem;
    bottom:84px;
  }
}

/* ABOUT / CONTACT */

.corner-nav {
  position:fixed;
  top:26px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 30px;
  z-index:80;
  pointer-events:none;
}
.corner-nav button {
  pointer-events:auto;
  appearance:none;
  border:0;
  background:transparent;
  padding:7px 0;
  color:rgba(255,255,255,.22);
  font:400 12px/1 Arial,sans-serif;
  letter-spacing:.08em;
  cursor:pointer;
  transition:color .08s linear;
}
.corner-nav button:hover,
.corner-nav button:focus-visible,
.corner-nav button[aria-expanded="true"] {
  color:#fff;
}
.corner-nav button:focus-visible {
  outline:1px solid #777;
  outline-offset:5px;
}
#info-panel {
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:70;
  background:black;
  padding:74px 22px;
  box-sizing:border-box;
}
#info-panel.open { display:flex; }
.info-content {
  width:min(520px,100%);
  text-align:center;
  font:400 14px/1.7 Arial,sans-serif;
  letter-spacing:.04em;
}
.info-content[hidden] { display:none; }
.info-content h2 {
  font:700 16px/1.3 Arial,sans-serif;
  letter-spacing:.13em;
  margin:0 0 25px;
}
.info-content p { margin:12px 0; }
.info-content a {
  color:rgba(255,255,255,.55);
  text-decoration:none;
  transition:color .08s linear;
}
.info-content a:hover,
.info-content a:focus-visible { color:white; }
.info-content .muted {
  color:rgba(255,255,255,.35);
}
body.info-open #ketaWord,
body.info-open .bridge,
body.info-open #warning {
  visibility:hidden;
}
body.entering .corner-nav {
  opacity:0;
  pointer-events:none;
}
@media(max-width:760px) {
  .corner-nav {
    top:19px;
    padding:0 20px;
  }
  .corner-nav button { font-size:11px; }
}

/* SOCIAL ICONS */

.social-icons {
  position:fixed;
  z-index:65;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(15px,2.1vw,31px);
  transform:translate(-50%,-50%);
  left:50%;
  top:calc(100% - 82px);
  white-space:nowrap;
}
.social-icons a,
.social-icons .unlinked {
  display:inline-flex;
  width:20px;
  height:20px;
  align-items:center;
  justify-content:center;
  padding:3px;
  box-sizing:content-box;
  color:rgba(255,255,255,.26);
  background:transparent;
  border:0;
  text-decoration:none;
  transition:color .08s linear;
}
.social-icons svg {
  width:19px;
  height:19px;
  fill:currentColor;
  display:block;
}
.social-icons a:hover,
.social-icons a:focus-visible { color:#fff; }
.social-icons .unlinked {
  cursor:default;
  color:rgba(255,255,255,.17);
}
.social-icons .unlinked:hover {
  color:rgba(255,255,255,.32);
}
body.info-open .social-icons {
  visibility:hidden;
}
body.entering .social-icons {
  opacity:0;
  pointer-events:none;
}
@media(max-width:760px) {
  .social-icons { gap:12px; }
  .social-icons a,
  .social-icons .unlinked {
    width:19px;
    height:19px;
    padding:2px;
  }
  .social-icons svg {
    width:17px;
    height:17px;
  }
}
</style>

<h1>
  <div id="ketaWord" aria-label="KETADATA">
    <div class="word-row single" id="single-row"></div>
    <div class="word-row split" id="split-row-1"></div>
    <div class="word-row split" id="split-row-2"></div>
  </div>

  <div class="bridge">
    <a id="base-link"
      href="https://ketadata.com/sur_9ase_iv.html">
      [ SUR_9ASE_VII ]
    </a>
  </div>
</h1>

<p id="warning">
  MAY TRIGGER SEIZURES IN PHOTOSENSITIVE INDIVIDUALS
</p>

<script>
const ketaWord = document.getElementById("ketaWord");
const isolated = document.getElementById("isolatedSlash");
const blackout = document.getElementById("blackout");

/* PLAYER DESTINATION */
const LETTER_DEST =
  "https://ketadata.com/surface_player.html";

const BASE_DEST =
  "https://ketadata.com/sur_9ase_iv.html";

const singleRow = document.getElementById("single-row");
const splitRow1 = document.getElementById("split-row-1");
const splitRow2 = document.getElementById("split-row-2");

const word = "KETADATA";
const letters = [];

let entering = false;
let hoverIdx = Math.floor(word.length / 2);

function buildLetter(ch,i) {
  const cell = document.createElement("span");
  cell.className = "cell";

  const s = document.createElement("span");
  s.className = "ch";
  s.textContent = ch;
  s.dataset.orig = ch;

  s.addEventListener("mouseenter",() => {
    if (ketaWord.dataset.locked === "1") return;
    hoverIdx = i;
    s.textContent = "/";
  });

  s.addEventListener("mouseleave",() => {
    if (ketaWord.dataset.locked === "1") return;
    s.textContent = s.dataset.orig;
  });

  cell.appendChild(s);
  letters.push(s);
  return cell;
}

for(let i=0;i<word.length;i++) {
  singleRow.appendChild(buildLetter(word[i],i));
}

for(let i=0;i<4;i++) {
  splitRow1.appendChild(buildLetter(word[i],i));
}

for(let i=4;i<word.length;i++) {
  splitRow2.appendChild(buildLetter(word[i],i));
}

function reset() {
  entering = false;
  ketaWord.dataset.locked = "";

  letters.forEach(s => {
    s.textContent = s.dataset.orig;
  });

  isolated.style.opacity = "0";

  document.body.classList.remove(
    "entering","blacked"
  );

  blackout.style.opacity = "0";
}

window.addEventListener("pageshow",e => {
  if(e.persisted) reset();
});

function placeIsolatedAtLetter(idx) {
  const el = letters[
    Math.max(0,Math.min(letters.length-1,idx))
  ];

  const r = el.getBoundingClientRect();

  isolated.style.left =
    (r.left+r.width/2)+"px";

  isolated.style.top =
    (r.top+r.height/2)+"px";

  const fs = parseFloat(
    window.getComputedStyle(ketaWord).fontSize
  ) || 200;

  isolated.style.fontSize =
    Math.max(64,fs)+"px";
}

function enterRoom(idx) {
  if(entering) return;

  entering = true;
  ketaWord.dataset.locked = "1";

  letters.forEach(s => {
    s.textContent = "/";
  });

  placeIsolatedAtLetter(idx);

  document.body.classList.add("entering");
  isolated.style.opacity = "1";

  setTimeout(() => {
    isolated.style.opacity = "0";
    document.body.classList.add("blacked");
  },950);

  setTimeout(() => {
    window.location.href =
      LETTER_DEST+"?surface="+idx;
  },1850);
}

ketaWord.addEventListener("click",() => {
  enterRoom(hoverIdx);
});

let isFlashing = false;
let flashInterval;

function startStrobe() {
  document.body.classList.add("strobe-active");

  flashInterval = setInterval(() => {
    document.body.style.backgroundColor =
      document.body.style.backgroundColor === "black"
        ? "white"
        : "black";
  },50);
}

function stopStrobe() {
  clearInterval(flashInterval);
  document.body.style.backgroundColor = "black";
  document.body.classList.remove("strobe-active");
}

function enterBaseImmediate() {
  if(entering) return;

  entering = true;
  stopStrobe();

  document.body.classList.add(
    "entering","blacked"
  );

  setTimeout(() => {
    window.location.href = BASE_DEST;
  },120);
}

document.getElementById("base-link")
  .addEventListener("click",e => {
    e.preventDefault();
    enterBaseImmediate();
  });

document.addEventListener("keydown",event => {
  if(document.body.classList.contains("info-open")) {
    return;
  }

  if(event.key === " " || event.code === "Space") {
    event.preventDefault();

    if(isFlashing) {
      stopStrobe();
    } else {
      startStrobe();
    }

    isFlashing = !isFlashing;
  }

  if(event.key === "Enter") {
    event.preventDefault();
    enterBaseImmediate();
  }
});

/* ABOUT / CONTACT */

const infoPanel =
  document.getElementById("info-panel");

const aboutToggle =
  document.getElementById("about-toggle");

const contactToggle =
  document.getElementById("contact-toggle");

const aboutContent =
  document.getElementById("about-content");

const contactContent =
  document.getElementById("contact-content");

let infoView = null;

function setInfoView(view) {
  infoView = infoView === view ? null : view;

  infoPanel.classList.toggle(
    "open",Boolean(infoView)
  );

  document.body.classList.toggle(
    "info-open",Boolean(infoView)
  );

  aboutContent.hidden = infoView !== "about";
  contactContent.hidden = infoView !== "contact";

  aboutToggle.setAttribute(
    "aria-expanded",
    String(infoView === "about")
  );

  contactToggle.setAttribute(
    "aria-expanded",
    String(infoView === "contact")
  );
}

aboutToggle.addEventListener("click",() => {
  setInfoView("about");
});

contactToggle.addEventListener("click",() => {
  setInfoView("contact");
});

document.addEventListener("keydown",event => {
  if(event.key === "Escape" && infoView) {
    setInfoView(infoView);
  }
});
</script>
